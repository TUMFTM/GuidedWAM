name: drivewam
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # Diffusion & Transformers
    - diffusers==0.36.0
    - transformers==4.55.2
    - accelerate==1.12.0
    - huggingface_hub==0.36.2
    - tokenizers==0.21.4
    - safetensors==0.7.0

    # Training utilities
    - einops==0.8.2
    - easydict==1.13
    - swanlab==0.7.10

    # Data
    - numpy==1.26.4
    - pandas==2.3.3
    - pyarrow==23.0.1

    # Vision
    - Pillow==11.3.0
    - opencv-python-headless==4.10.0.82
    - matplotlib==3.10.8
    - moviepy==2.2.1

    # Misc
    - tqdm==4.67.3
    - scipy==1.15.3
    - psutil==7.2.2

    # NavSim evaluation (optional)
    - nuplan-devkit==1.2.0
    - shapely==2.1.2
    - pyquaternion==0.9.9
    - geopandas==1.1.3
    - hydra-core>=1.3.2
    - omegaconf>=2.3.0
    - pytorch-lightning>=2.0.0
    - ray>=2.0.0

# NOTE: Install PyTorch separately after creating the environment:
#   conda activate drivewam
#   pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cu126
#
# Install Flash Attention (optional, requires CUDA):
#   pip install flash-attn==2.8.3 --no-build-isolation
#
# VLM preprocessing (optional):
#   pip install vllm qwen-vl-utils
